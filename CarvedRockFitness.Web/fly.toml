app = "gawdsizwe-web"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Web__DataProtectionKeysPath = "/app/keys"

[[mounts]]
  source = "gym_web_uploads"
  destination = "/app/wwwroot/uploads"

[[mounts]]
  source = "web_keys"
  destination = "/app/keys"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout  = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
