name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore CarvedRockFitness.sln

      - name: Build
        run: dotnet build CarvedRockFitness.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test CarvedRockFitness.API.Tests/CarvedRockFitness.API.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit-tests.trx"

      - name: Integration tests
        run: dotnet test CarvedRockFitness.API.IntegrationTests/CarvedRockFitness.API.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=integration-tests.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
